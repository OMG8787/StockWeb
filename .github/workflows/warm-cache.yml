name: Warm StockRadar cache

# Vercel's own Cron feature is capped at once a day on the Hobby (free)
# plan — nowhere near frequent enough to keep the site's short-lived data
# caches warm. GitHub Actions' scheduled workflows have no such limit, so
# this pings the site's warm-cache endpoint on a schedule instead, keeping
# it pre-computed for whenever a real visitor actually shows up.
#
# GitHub coalesces/delays scheduled workflows under platform load, so "every
# 5 minutes" is a best-effort target, not a guarantee — that's fine here,
# the goal is "usually warm," not split-second freshness.
#
# 2026-09-20：原本這裡是 24 小時全年無休每 5 分鐘觸發一次，不分平假日、不分開盤
# 收盤——Vercel 免費方案（Fluid Active CPU）用量吃緊後盤點出來的浪費源頭之一：
# 半夜、週末台股/美股/台指期夜盤全部休市，資料完全不會變，還是照樣重新計算一次
# 「技術訊號共振股」這類要逐檔抓K線的昂貴項目。改成：
#  - 平日（UTC週一~週五）UTC 0-20 時（約台北時間 08:00 ~ 隔天 04:59，涵蓋台股
#    盤中、台指期夜盤、美股盤中）維持每 5 分鐘。
#  - 平日剩下的空窗（約台北時間 05:00-08:00）降到每 30 分鐘，只是保底不讓快取
#    放到完全過期，不追求分鐘級新鮮度。
#  - 週六週日整天不觸發——台股/美股完全休市，背景重算純粹浪費；真的有人假日
#    打開網站，靠現場即時運算的既有 degrade-gracefully 機制正常服務，不影響
#    正確性，只是那次請求會稍慢一點（見 api/cron/warm-cache/route.ts 的說明）。
#
# 2026-10-04：Vercel Fluid Active CPU 已用到免費額度約 136%（近 30 天 5h27m／4h），
# 再依「盤中才需要密集預熱」收斂一次（每天 258 次 → 154 次，約 -40%）：
#  - 台股盤中 UTC 0-6 時（台北 08:00-14:59）：每 5 分鐘（GitHub 排程下限）
#  - 美股盤中 UTC 13-21 時（台北 21:00-05:59，涵蓋夏令／冬令時間）：每 10 分鐘
#  - 其餘平日時段（台北 15:00-20:59、06:00-07:59）：每 30 分鐘保底
#  - 週末照舊不跑
# 預熱沒跑到的空檔，靠資料層的「過期先回舊資料、背景更新」（lib/data/swrPolicy.ts）
# 兜底：訪客拿到舊值的同時背景重算，不會現場等；沒有訪客就完全不重算。
on:
  schedule:
    - cron: "*/5 0-6 * * 1-5"
    - cron: "*/10 13-21 * * 1-5"
    - cron: "0,30 7-12,22-23 * * 1-5"
  workflow_dispatch: {}

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      # 2026-10-04：原本只用 `curl -sf` 看 HTTP 狀態——路由刻意讓每一項獨立降級、
      # 整體仍回 200，所以某一項預熱失敗時 Actions 紀錄完全看不出來。改成把回應
      # 的 outcomes 印出來：整體失敗（非 200 或 ok 不是 true）讓 job 失敗；個別項目
      # 失敗只標成 ::warning::（顯示在該次執行的摘要裡），不讓 job 變紅、不每 5 分鐘
      # 寄一次失敗通知信。
      - name: Ping warm-cache endpoint
        run: |
          body=$(mktemp)
          code=$(curl -sS --max-time 90 -o "$body" -w '%{http_code}' "https://stock-web-blond.vercel.app/api/cron/warm-cache" || echo "000")
          echo "HTTP $code"
          jq -r '.outcomes // {} | to_entries[] | "\(.key): \(.value)"' "$body" 2>/dev/null || cat "$body"
          jq -r '.outcomes // {} | to_entries[] | select(.value | startswith("失敗")) | "::warning title=預熱失敗::\(.key) — \(.value)"' "$body" 2>/dev/null || true
          if [ "$code" != "200" ] || [ "$(jq -r '.ok' "$body" 2>/dev/null)" != "true" ]; then
            echo "::error title=預熱整體失敗::HTTP $code"
            exit 1
          fi
